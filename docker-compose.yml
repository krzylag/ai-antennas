services:
  opencode:
    image: ciemnyzenek/ai-antennas-opencode:latest
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/opencode
      OPENCODE_CONFIG: /config/opencode.json
      XDG_CONFIG_HOME: /home/opencode/.local/share/opencode/config
      XDG_DATA_HOME: /home/opencode/.local/share/opencode/data
      XDG_STATE_HOME: /home/opencode/.local/share/opencode/state
      XDG_CACHE_HOME: /tmp/opencode-cache
      LOCAL_MODEL: ${LOCAL_MODEL:-}
      LOCAL_CONTEXT_SIZE: ${LOCAL_CONTEXT_SIZE:-16384}
      LOCAL_GPU_LAYERS: ${LOCAL_GPU_LAYERS:-999}
    volumes:
      - ./workspace:/workspace:rw
      - ./config/opencode.json:/config/opencode.json:ro
      - ./models:/models:rw
      - ./sessions:/home/opencode/.local/share/opencode:rw
    working_dir: /workspace
    stdin_open: true
    tty: true
    gpus: all
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 24g
    memswap_limit: 32g
    stop_grace_period: 15m
